name: Submit Repositories for Migration

on:
    # schedule:
    #     - cron: "5 12 * * 5"
    workflow_dispatch:

permissions:
    contents: read
    issues: write
    actions: write

concurrency:
    group: submit-repos
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.orgs.outputs.result }}
        steps:
            - name: Parse organizations
              id: orgs
              uses: actions/github-script@v9
              env:
                  ORGANIZATIONS: ${{ vars.ORGANIZATIONS }}
              with:
                  result-encoding: string
                  script: |
                      const orgs = JSON.parse(process.env.ORGANIZATIONS)
                      return JSON.stringify(orgs.map(org => ({ org })))

    scan-and-dispatch:
        needs: prepare
        if: needs.prepare.outputs.matrix != '[]'
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
            fail-fast: false
        steps:
            - name: Generate GitHub App token for ${{ matrix.org }}
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.GH_APP_ID }}
                  private-key: ${{ secrets.GH_APP_PEM }}
                  owner: ${{ matrix.org }}

            - name: Checkout
              uses: actions/checkout@v6

            - name: Scan repositories for ${{ matrix.org }}
              id: scan
              uses: actions/github-script@v9
              env:
                  BATCH_SIZE: ${{ vars.BATCH_SIZE }}
                  ORG: ${{ matrix.org }}
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  result-encoding: string
                  script: |
                      const scan = require('./.github/scripts/scan-repositories.js')
                      const repos = await scan({ github, core, process })
                      return JSON.stringify(repos)

            - name: Create tracking issue and dispatch workers
              if: steps.scan.outputs.result != '[]'
              uses: actions/github-script@v9
              env:
                  SCAN_RESULTS: ${{ steps.scan.outputs.result }}
                  ORG: ${{ matrix.org }}
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const dispatch = require('./.github/scripts/dispatch-migrations.js')
                      const orgEntry = { org: process.env.ORG, repos: JSON.parse(process.env.SCAN_RESULTS) }
                      await dispatch({ github, core, context, orgEntry })
