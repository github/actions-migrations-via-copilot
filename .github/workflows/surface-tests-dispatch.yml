name: Surface Tests (dispatch)

# Asks the private testing repo to run the cross-surface plugin suite (tests/surfaces/)
# against this commit. Results are recorded in that repo.

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'tests/surfaces/**'
      - '.github/workflows/surface-tests-dispatch.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - 'tests/surfaces/**'
      - '.github/workflows/surface-tests-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    # Copies of this repo and fork PRs have no access to the testing repo.
    if: >-
      github.repository == 'github/actions-migrations-via-copilot' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check the testing app is configured
        id: check
        env:
          APP_KEY: ${{ secrets.SURFACE_TESTS_APP_KEY }}
          TESTING_REPO: ${{ vars.SURFACE_TESTS_REPO }}
        run: |
          if [ -z "$APP_KEY" ] || [ -z "$TESTING_REPO" ]; then
            echo "::warning::SURFACE_TESTS_APP_KEY or SURFACE_TESTS_REPO is not set; not requesting surface tests."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            # This repo's Actions logs are public; keep the testing repo's name out of them.
            echo "::add-mask::$TESTING_REPO"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get a token for the testing repo
        if: steps.check.outputs.ready == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SURFACE_TESTS_APP_ID }}
          private-key: ${{ secrets.SURFACE_TESTS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.SURFACE_TESTS_REPO }}

      - name: Request a test run
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KIND: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
          PR: ${{ github.event.pull_request.number }}
          TESTING_REPO: ${{ vars.SURFACE_TESTS_REPO }}
        run: |
          jq -n --arg sha "$SHA" --arg kind "$KIND" --arg pr "$PR" \
            '{event_type: "plugin-changed", client_payload: {sha: $sha, kind: $kind, pr: $pr}}' \
            | gh api "repos/$GITHUB_REPOSITORY_OWNER/$TESTING_REPO/dispatches" --input -
          echo "Requested surface tests for $KIND commit \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"
